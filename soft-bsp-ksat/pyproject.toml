[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soft-bsp-ksat"
version = "0.1.0"
description = "Python SID/BSP for random K-SAT, later framed as max-ent RL / SAC"
requires-python = ">=3.12"
license = { text = "GPL-2.0-or-later" }
dependencies = [
  "numpy>=1.26",
  "numba>=0.59",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bsp-python = "baseline_bsp:main"

[tool.setuptools]
py-modules = ["sat_instance", "survey_propagation", "baseline_bsp", "walksat"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
